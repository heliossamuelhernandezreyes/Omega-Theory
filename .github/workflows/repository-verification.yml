name: Repository verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create documented environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Reject unmanifested scientific outputs
        run: |
          . .venv/bin/activate
          mkdir -p generated outputs
          printf 'unmanifested test artifact\n' > generated/unmanifested-test.txt
          printf 'unmanifested test artifact\n' > outputs/unmanifested-test.txt
          if python scripts/verify_repository.py; then
            echo "Verifier accepted unmanifested files in generated/ or outputs/."
            exit 1
          fi
          rm generated/unmanifested-test.txt outputs/unmanifested-test.txt
          rmdir generated outputs

      - name: Verify integrity and archived checks
        run: |
          . .venv/bin/activate
          python scripts/verify_repository.py
          python -m omega_repro.validate_core
          python -m omega_repro.validate_deliveries_01_17
