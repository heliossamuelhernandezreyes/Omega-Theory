<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Error de aditividad de candidatos energía–frecuencia</title>
  <desc id="desc">La forma lineal presenta un error medio de 3.41 por diez a la menos dieciséis. Los candidatos cuadrático, raíz, logarítmico y afín muestran errores medios entre 0.96 y 49.97.</desc>
  <rect width="820" height="500" fill="white"/>
  <text x="410" y="32" text-anchor="middle" font-family="sans-serif" font-size="21">Prueba de candidatos energía–frecuencia</text>
  <text x="410" y="54" text-anchor="middle" font-family="sans-serif" font-size="13">Longitud de barra = log10(error medio) desplazado para visualización</text>
  <g font-family="sans-serif" font-size="14" fill="black">
    <text x="185" y="121" text-anchor="end">Lineal</text><text x="185" y="191" text-anchor="end">Log(1+ω)</text><text x="185" y="261" text-anchor="end">Afín</text><text x="185" y="331" text-anchor="end">Raíz</text><text x="185" y="401" text-anchor="end">Cuadrática</text>
  </g>
  <line x1="200" y1="85" x2="200" y2="425" stroke="black"/>
  <rect x="200" y="96" width="8" height="34" fill="#4f46e5"/><rect x="200" y="166" width="598" height="34" fill="#4f46e5"/><rect x="200" y="236" width="599" height="34" fill="#4f46e5"/><rect x="200" y="306" width="602" height="34" fill="#4f46e5"/><rect x="200" y="376" width="665" height="34" fill="#4f46e5"/>
  <g font-family="sans-serif" font-size="13" fill="black">
    <text x="220" y="119">3.41×10⁻¹⁶</text><text x="790" y="189" text-anchor="end">0.9606</text><text x="790" y="259" text-anchor="end">1.0000</text><text x="790" y="329" text-anchor="end">1.1299</text><text x="790" y="399" text-anchor="end">49.9673</text>
  </g>
  <text x="410" y="464" text-anchor="middle" font-family="sans-serif" font-size="12">Sólo la forma lineal satisface la aditividad dentro de precisión numérica.</text>
  <text x="410" y="486" text-anchor="middle" font-family="sans-serif" font-size="11">Fuente: Entrega 21, 10,000 pares de frecuencias por candidato</text>
</svg>
