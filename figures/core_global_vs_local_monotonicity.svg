<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Monotonía global frente a local</title>
  <desc id="desc">En 200 trayectorias, cero por ciento mostró disminución del conteo global de historias y cien por ciento mostró al menos una disminución de la entropía del macroestado actual.</desc>
  <rect width="760" height="480" fill="white"/>
  <text x="380" y="34" text-anchor="middle" font-family="sans-serif" font-size="22">Monotonía global frente a local</text>
  <line x1="90" y1="400" x2="710" y2="400" stroke="black"/>
  <line x1="90" y1="70" x2="90" y2="400" stroke="black"/>
  <g font-family="sans-serif" font-size="13" fill="black">
    <text x="72" y="405" text-anchor="end">0</text><text x="72" y="325" text-anchor="end">25</text><text x="72" y="245" text-anchor="end">50</text><text x="72" y="165" text-anchor="end">75</text><text x="72" y="85" text-anchor="end">100%</text>
    <text x="250" y="432" text-anchor="middle">Conteo global</text><text x="550" y="432" text-anchor="middle">Entropía macro actual</text>
  </g>
  <rect x="190" y="399" width="120" height="1" fill="#4f46e5"/>
  <rect x="490" y="80" width="120" height="320" fill="#4f46e5"/>
  <text x="250" y="382" text-anchor="middle" font-family="sans-serif" font-size="18">0%</text>
  <text x="550" y="70" text-anchor="middle" font-family="sans-serif" font-size="18">100%</text>
  <text x="380" y="466" text-anchor="middle" font-family="sans-serif" font-size="12">Fuente: Entrega 18, 200 trayectorias</text>
</svg>
