[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-repro"
version = "0.1.0"
description = "Curated reproducibility checks for Omega Theory"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "sympy", "networkx"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
